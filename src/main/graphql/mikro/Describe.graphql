# What mikro says of an annotation collection: its `descriptors`, the facts a port's requires
# and provides are stated over. A lens and a dataset bring theirs in the query that loads them
# (`GetLens`, `GetArrayDataset`); a collection has no such query at expand, so this is its one.
query AnnotationCollectionDescriptors($id: ID!) {
  annotationCollection(id: $id) {
    id
    descriptors
  }
}
