# What mikro says of one object: its `descriptors`, the facts a port's requires and provides are
# stated over (`@mikro/n_space_axes`, `@mikro/n_channels`, …). Every identified type has the
# field; these fetch it for the three structures the actions take, when one is expanded.
query LensDescriptors($id: ID!) {
  lens(id: $id) {
    id
    descriptors
  }
}

query ArrayDatasetDescriptors($id: ID!) {
  arrayDataset(id: $id) {
    id
    descriptors
  }
}

query AnnotationCollectionDescriptors($id: ID!) {
  annotationCollection(id: $id) {
    id
    descriptors
  }
}
