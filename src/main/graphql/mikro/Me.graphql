mutation CreateArrayDataset($input: CreateArrayDatasetInput!) {
  createArrayDataset(input: $input) {
    id
    name
  }
}

mutation RequestZarrUpload($input: RequestZarrUploadInput!) {
  requestZarrUpload(input: $input) {
    accessKey
    status
    secretKey
    bucket
    key
    sessionToken
    store
  }
}

mutation FinishZarrUpload($input: FinishZarrUploadInput!) {
  finishZarrUpload(input: $input) {
    id
    key
    bucket
    path
  }
}

mutation RequestZarrAccess($input: RequestZarrAccessInput!) {
  requestZarrAccess(input: $input) {
    accessKey
    secretKey
    bucket
    key
    sessionToken
    path
  }
}

# Give an uploaded dataset its physical size: a coordinate system carrying the units, and the
# edge (a SCALE, or an AFFINE with the origin) registering the dataset's pixel grid into it. What
# mikro's Python `dataset.calibrate(...)` sends.
mutation CreateCoordinateSystem($input: CreateCoordinateSystemInput!) {
  createCoordinateSystem(input: $input) {
    id
    name
  }
}
